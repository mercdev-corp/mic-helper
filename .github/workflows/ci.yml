name: CI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution dependencies
        run: dotnet restore MicHelper.sln -m:1

      - name: Run unit tests
        run: dotnet test tests/MicHelper.Tests/MicHelper.Tests.csproj -c Release --no-restore -m:1
